name: Attendance Reminders

# Vercel Hobby-tier cron jobs are daily-granularity only, too coarse for a
# "30 minutes before event" check — this runs the check instead, on a
# schedule GitHub Actions supports natively for free.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call attendance-reminders endpoint
        run: |
          curl -sf -X POST https://savor-and-style-portal.vercel.app/api/cron/attendance-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
